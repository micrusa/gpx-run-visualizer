spring:
  application:
    name: gpx-run-viz
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  sql:
    init:
      mode: always
      schema-locations: classpath:postgis.sql
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gpxrunviz?connectTimeout=3&socketTimeout=3}
    username: ${SPRING_DATASOURCE_USERNAME:gpxrunviz}
    password: ${SPRING_DATASOURCE_PASSWORD:gpxrunviz_dev}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1
server:
  port: 8080
  tomcat:
    max-part-count: -1
    max-parameter-count: -1
    max-http-form-post-size: -1
    max-swallow-size: -1
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
